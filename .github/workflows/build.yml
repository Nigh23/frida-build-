name: Build Frida Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive   # ⭐ 必须

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          python3 python3-pip git ninja-build cmake clang pkg-config unzip \
          curl wget build-essential

    - name: Setup Python env
      run: |
        pip3 install --upgrade pip
        pip3 install setuptools wheel

    - name: Setup NDK
      run: |
        wget https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
        unzip android-ndk-r25c-linux.zip
        echo "ANDROID_NDK_HOME=$PWD/android-ndk-r25c" >> $GITHUB_ENV

    - name: Bootstrap Frida
      run: |
        make bootstrap   # ⭐ 非常关键

    - name: Build Frida Core (Android ARM64)
      run: |
        make core-android-arm64

    - name: Build Frida Gadget (Android ARM64)
      run: |
        make gadget-android-arm64

    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: frida-android-build
        path: |
          build/frida-core/**
          build/frida-gadget/**
